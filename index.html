<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#9f2089" />
  <meta name="description" content="Interactive Meesho concept prototype for persona-led discovery, regional relevance, Meesho Mall, MTrusted and proof-first purchase journeys." />
  <title>Meesho Interactive Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page-glow glow-one"></div>
  <div class="page-glow glow-two"></div>

  <main class="site-shell">
    <section class="prototype-layout">
      <aside class="persona-panel glass-panel">
        <div class="persona-rail-label">
          <span class="panel-kicker">PERSONA JOURNEYS</span>
          <span class="rail-hint">Switch journeys</span>
        </div>
        <div id="persona-list" class="persona-list"></div>
      </aside>

      <section class="phone-stage" aria-label="Interactive phone prototype">
        <div id="device-canvas" class="device-canvas"></div>
      </section>

      <aside class="detail-panel glass-panel">
        <section class="prototype-control-card" aria-label="Prototype controls">
          <div class="prototype-control-heading">
            <div>
              <span class="panel-kicker">MEESHO · INTERACTIVE PROTOTYPE</span>
              <h2>Choose a use case</h2>
              <p>Select any persona from the left rail, then explore the phone journey in the centre.</p>
            </div>
            <span class="count-pill">5 journeys</span>
          </div>
          <div class="panel-actions">
            <button id="hotspot-toggle" class="toolbar-button" type="button">Show click map</button>
            <button id="restart-button" class="toolbar-button primary-tool" type="button">Restart journey</button>
          </div>
        </section>
        <div id="detail-panel"></div>
      </aside>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
