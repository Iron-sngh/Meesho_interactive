<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#9f2089" />
  <meta name="description" content="Interactive Meesho concept prototype for persona-led discovery, regional relevance, Meesho Mall, MTrusted and proof-first purchase journeys." />
  <title>Meesho Interactive Prototype</title>
  <style>
:root {
  --bg: #fff7fc;
  --panel: rgba(255, 255, 255, 0.88);
  --border: rgba(159, 32, 137, 0.14);
  --text: #1f1832;
  --muted: #6f6583;
  --brand: #f11b8d;
  --brand-dark: #9f2089;
  --brand-soft: #fde8f5;
  --purple-soft: #efe8ff;
  --purple-mid: #d7c5ff;
  --lime: #eff9ee;
  --green: #23a458;
  --amber: #ffb800;
  --shadow: 0 24px 60px rgba(120, 36, 110, 0.12);
  --shadow-soft: 0 16px 35px rgba(101, 46, 108, 0.1);
  --radius-xl: 24px;
  --radius-lg: 18px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --phone-width: 390px;
  --surface: #ffffff;
  --hotspot: rgba(241, 27, 141, 0.16);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top left, #ffe6f6, transparent 30%), radial-gradient(circle at bottom right, #efe6ff, transparent 28%), var(--bg);
  color: var(--text);
}
button, input { font: inherit; }
button { cursor: pointer; }

.page-glow {
  position: fixed;
  inset: auto;
  width: 280px;
  height: 280px;
  border-radius: 999px;
  filter: blur(20px);
  opacity: .45;
  pointer-events: none;
  z-index: 0;
}
.glow-one { top: 70px; left: -60px; background: rgba(241, 27, 141, .12); }
.glow-two { right: -40px; bottom: 110px; background: rgba(130, 91, 250, .12); }

.site-shell {
  position: relative;
  z-index: 1;
  max-width: 1500px;
  margin: 0 auto;
  padding: 28px;
}

.glass-panel {
  background: var(--panel);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, .55);
  box-shadow: var(--shadow-soft);
}

.site-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  padding: 24px 26px;
  border-radius: var(--radius-xl);
}
.brand-lockup {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  max-width: 920px;
}
.logo-mark {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--brand-dark), var(--brand));
  display: grid;
  place-items: center;
  color: #fff;
  font-weight: 800;
  font-size: 1.65rem;
  box-shadow: 0 10px 25px rgba(159, 32, 137, 0.25);
}
.eyebrow, .panel-kicker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  letter-spacing: .18em;
  text-transform: uppercase;
  font-size: .72rem;
  font-weight: 700;
  color: var(--brand-dark);
}
.site-header h1 {
  margin: 8px 0 10px;
  font-size: clamp(1.8rem, 2.6vw, 2.8rem);
  line-height: 1.08;
}
.site-header h1 span { color: var(--brand-dark); }
.site-header p { margin: 0; color: var(--muted); max-width: 760px; line-height: 1.55; }
.header-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
.toolbar-button {
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text);
  padding: 12px 16px;
  border-radius: 999px;
  font-weight: 700;
  box-shadow: 0 8px 20px rgba(93, 53, 98, 0.06);
}
.toolbar-button:hover { transform: translateY(-1px); }
.primary-tool { background: linear-gradient(135deg, var(--brand-dark), var(--brand)); color: #fff; border-color: transparent; }

.prototype-layout {
  margin-top: 24px;
  display: grid;
  grid-template-columns: 320px minmax(400px, 1fr) 340px;
  gap: 22px;
  align-items: start;
}
.persona-panel, .detail-panel {
  border-radius: var(--radius-xl);
  padding: 20px;
}
.panel-title-row {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 12px;
}
.panel-title-row h2 { margin: 6px 0 0; font-size: 1.28rem; }
.count-pill {
  padding: 8px 12px;
  border-radius: 999px;
  font-weight: 700;
  font-size: .85rem;
  background: var(--purple-soft);
  color: #5c3cb3;
}
.persona-list { display: grid; gap: 12px; margin-top: 18px; }
.persona-card {
  padding: 14px 15px;
  border-radius: 18px;
  border: 1px solid rgba(120, 91, 250, .1);
  background: rgba(255,255,255,.72);
  transition: .18s ease;
  text-align: left;
}
.persona-card:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(89, 53, 98, .08); }
.persona-card.active {
  background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(252, 241, 251, .96));
  border-color: rgba(159,32,137,.22);
  box-shadow: 0 12px 28px rgba(159, 32, 137, .11);
}
.persona-card .persona-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.persona-card b { font-size: 1rem; }
.persona-card p { margin: 5px 0 10px; color: var(--muted); font-size: .92rem; line-height: 1.45; }
.persona-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.persona-tag {
  padding: 6px 10px;
  border-radius: 999px;
  font-size: .74rem;
  font-weight: 700;
  background: #f6f3fb;
  color: #67547e;
}
.principle-card {
  margin-top: 16px;
  padding: 16px;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(159,32,137,.08), rgba(136, 95, 251, .1));
  display: flex;
  gap: 14px;
  align-items: start;
}
.principle-icon {
  width: 32px; height: 32px; border-radius: 12px; display: grid; place-items: center;
  background: #fff; color: var(--brand-dark); font-weight: 800;
}
.principle-card p { margin: 6px 0 0; color: var(--muted); line-height: 1.45; }

.phone-stage { display: grid; gap: 14px; justify-items: center; }
.stage-toolbar {
  width: calc(var(--phone-width) + 50px);
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px; padding: 10px 16px;
  border-radius: 999px; background: rgba(255,255,255,.82);
  border: 1px solid rgba(255,255,255,.65); box-shadow: var(--shadow-soft);
}
.stage-label { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: var(--brand-dark); font-weight: 800; }
.live-pill {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: .82rem; font-weight: 700; color: var(--green);
}
.live-pill i { width: 10px; height: 10px; background: var(--green); border-radius: 999px; box-shadow: 0 0 0 6px rgba(35, 164, 88, .12); }
.stage-help { margin: 0; color: var(--muted); text-align: center; max-width: 420px; line-height: 1.4; }

.device-canvas {
  position: relative;
  width: calc(var(--phone-width) + 36px);
  padding: 14px 18px 18px;
  border-radius: 42px;
  background: linear-gradient(180deg, #1f1f23, #0d0e11 18%, #23252a 65%, #15161a);
  box-shadow: 0 30px 60px rgba(18, 9, 30, .22), inset 0 0 0 1px rgba(255,255,255,.08);
}
.device-canvas::before {
  content: "";
  position: absolute;
  inset: 8px;
  border-radius: 34px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.09), inset 0 0 16px rgba(255,255,255,.07);
  pointer-events: none;
}

.phone-shell {
  position: relative;
  width: var(--phone-width);
  height: 845px;
  margin: 0 auto;
  border-radius: 32px;
  background: #fff;
  overflow: hidden;
}
.phone-notch {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 110px;
  height: 28px;
  border-radius: 18px;
  background: #0a0a0d;
  z-index: 8;
}
.phone-status {
  position: absolute; top: 10px; left: 0; right: 0;
  padding: 0 18px;
  height: 22px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: .72rem; font-weight: 700; color: #161326; z-index: 6;
}
.status-icons { display: flex; gap: 6px; align-items: center; }
.status-dot { width: 10px; height: 10px; border-radius: 999px; border: 2px solid currentColor; }
.status-bar { width: 15px; height: 9px; border: 2px solid currentColor; border-radius: 3px; position: relative; }
.status-bar::after { content:""; position:absolute; inset:2px; background: currentColor; border-radius:1px; }
.phone-content {
  position: absolute;
  inset: 34px 0 0;
  overflow-y: auto;
  background: linear-gradient(180deg, #fff, #fefcff);
}
.phone-content::-webkit-scrollbar { width: 0; height: 0; }

.screen-root { min-height: calc(100% - 82px); padding-bottom: 94px; }
.top-appbar {
  position: sticky; top: 0; z-index: 5;
  padding: 14px 16px 12px;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid #f0e8f2;
}
.appbar-row, .small-appbar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.brand-wordmark { font-size: 1.65rem; font-weight: 800; color: var(--brand-dark); letter-spacing: -.04em; }
.icon-row { display: flex; align-items: center; gap: 12px; }
.circle-icon, .ghost-icon {
  width: 34px; height: 34px; border-radius: 999px; border: 1px solid #ece6f3; background: #fff;
  display: grid; place-items: center; color: #392b4d; font-size: .95rem; font-weight: 700;
}
.ghost-icon { background: #fff7fd; }
.profile-chip { display: inline-flex; align-items: center; gap: 8px; font-size: .85rem; font-weight: 700; color: #48355a; }
.profile-chip .avatar { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; background: linear-gradient(135deg, #f6d0ec, #ece5ff); font-size: .78rem; }
.search-shell {
  margin-top: 12px;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border: 1px solid #ece6f2;
  border-radius: 12px;
  background: #fbfafc;
  color: #7a708b;
  font-size: .84rem;
}
.utility-chips { margin-top: 10px; display: flex; gap: 8px; overflow-x: auto; }
.utility-chip, .filter-chip, .sub-chip, .tab-chip {
  display: inline-flex; align-items: center; gap: 6px;
  white-space: nowrap;
  padding: 7px 10px;
  border-radius: 999px;
  background: #f6f3fb;
  color: #5d526e;
  font-size: .73rem;
  font-weight: 700;
  border: 1px solid transparent;
}
.filter-chip.active, .tab-chip.active {
  background: var(--brand-soft);
  color: var(--brand-dark);
  border-color: rgba(159,32,137,.14);
}
.screen-section { padding: 14px 14px 0; }
.section-header { display: flex; justify-content: space-between; gap: 10px; align-items: end; margin-bottom: 10px; }
.section-header h3 { margin: 0; font-size: 1rem; line-height: 1.1; }
.section-header p { margin: 3px 0 0; color: var(--muted); font-size: .73rem; line-height: 1.3; }
.link-action { font-size: .77rem; font-weight: 800; color: var(--brand); background: none; border: 0; padding: 0; }
.cards-row, .product-grid, .trust-grid, .mini-grid, .brand-grid, .proof-grid, .hero-grid {
  display: grid; gap: 10px;
}
.hero-banner {
  position: relative;
  padding: 16px;
  border-radius: 18px;
  overflow: hidden;
  color: #fff;
  min-height: 128px;
  background: linear-gradient(120deg, #7d1c73, #f1439d 52%, #ff875c);
}
.hero-banner.purple { background: linear-gradient(135deg, #6d2be0, #8f55f8 55%, #c78dff); }
.hero-banner.orange { background: linear-gradient(135deg, #942a37, #ff7d35 55%, #ffd36d); }
.hero-banner.mall { background: linear-gradient(135deg, #f11b8d, #ff5ab3 55%, #ffb7da); color:#fff; }
.hero-banner .eyebrow-inline { display: inline-block; padding: 5px 9px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: .66rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.hero-banner h2 { margin: 10px 0 8px; font-size: 1.25rem; line-height: 1.1; max-width: 210px; }
.hero-banner p { margin: 0; font-size: .75rem; max-width: 220px; line-height: 1.4; color: rgba(255,255,255,.88); }
.hero-cta { margin-top: 12px; display: inline-flex; gap: 8px; align-items: center; padding: 9px 12px; border-radius: 999px; border: 0; font-weight: 800; font-size: .76rem; color: #902877; background: #fff; }
.hero-badge {
  position: absolute; right: 14px; bottom: 14px;
  padding: 7px 10px; border-radius: 999px;
  font-size: .68rem; font-weight: 800; background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.16);
}
.category-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.category-card {
  padding: 10px 8px;
  border-radius: 15px;
  background: #fff;
  border: 1px solid #efe7f2;
  min-height: 98px;
  text-align: left;
}
.category-card .art-box, .product-image, .brand-logo, .sku-image, .thumbnail, .look-tile-art {
  border-radius: 12px;
  background: linear-gradient(180deg, #f7f3fb, #efe8ff);
}
.category-card .art-box {
  height: 48px;
  display: grid; place-items: center;
  font-size: 1.3rem; font-weight: 800; color: var(--brand-dark);
}
.category-card b { display: block; margin-top: 8px; font-size: .75rem; line-height: 1.25; }
.category-card span { display:block; margin-top: 3px; color: var(--muted); font-size: .64rem; line-height: 1.2; }
.two-up, .three-up, .four-up { display:grid; gap:10px; }
.two-up { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.three-up { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.four-up { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.promo-card, .insight-card, .trust-card, .bundle-card, .profile-card, .review-card, .mini-card {
  border-radius: 16px;
  border: 1px solid #efe7f2;
  background: #fff;
}
.promo-card { padding: 14px; min-height: 118px; }
.promo-card h4, .trust-card h4, .mini-card h4 { margin: 0 0 6px; font-size: .92rem; }
.promo-card p, .trust-card p, .mini-card p, .profile-card p { margin: 0; color: var(--muted); font-size: .72rem; line-height: 1.35; }
.promo-card .pill-row, .chip-row, .proof-chip-row { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.subtle-pill, .tiny-pill, .badge-pill {
  padding: 6px 9px; border-radius: 999px; font-size: .64rem; font-weight: 800;
}
.subtle-pill { background: #f4effb; color: #5c4984; }
.badge-pill { background: #fff1f7; color: var(--brand-dark); border: 1px solid rgba(159,32,137,.1); }
.tiny-pill { background: #ecf8ee; color: #16713d; }

.product-card {
  padding: 10px; border-radius: 16px; border: 1px solid #efe7f2; background: #fff;
  display: grid; gap: 8px; min-width: 0;
}
.product-image {
  position: relative; height: 95px; overflow: hidden;
  display:flex; align-items:center; justify-content:center;
}
.product-image::after {
  content: attr(data-art);
  font-size: 1.5rem; font-weight: 800; color: rgba(81,58,114,.72);
}
.product-badges { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.favorite-tag {
  position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 999px;
  display: grid; place-items: center; background: rgba(255,255,255,.9); color: #f059a4; font-size: .75rem;
}
.product-card b { font-size: .76rem; line-height: 1.28; }
.product-meta { color: var(--muted); font-size: .68rem; }
.price-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.price { font-size: .98rem; font-weight: 800; color: #2b1c3e; }
.old-price { font-size: .68rem; color: #9c92aa; text-decoration: line-through; }
.rating { font-size: .68rem; color: #5d526e; }
.rating b { font-size: .68rem; }

.product-detail-hero {
  padding: 14px;
  display: grid; grid-template-columns: 150px 1fr; gap: 12px;
}
.sku-image { height: 178px; display: grid; place-items: center; position: relative; font-size: 2.7rem; font-weight: 900; color: #46335f; }
.thumbnail-row { display:flex; gap:8px; margin-top: 10px; }
.thumbnail { width: 38px; height: 38px; display: grid; place-items:center; color:#66537a; font-size: .85rem; }
.info-stack h2 { margin: 2px 0 4px; font-size: 1.24rem; line-height: 1.15; }
.info-subline { color: var(--muted); font-size: .74rem; }
.hero-price { margin: 12px 0 10px; }
.hero-price .price { font-size: 2rem; color: #3c2454; }
.size-grid { display:flex; gap:8px; margin-top: 8px; flex-wrap: wrap; }
.size-pill {
  padding: 8px 12px; min-width: 36px; text-align: center; border-radius: 10px; border: 1px solid #e4dbe8; background:#fff; font-weight:700; font-size:.82rem;
}
.size-pill.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.info-card {
  margin: 0 14px 12px; padding: 14px; border-radius: 16px; background: #fff; border: 1px solid #efe7f2;
}
.details-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
.detail-item {
  padding: 10px; border-radius: 12px; background: #fbf9fd; border: 1px solid #f1eaf5;
}
.detail-item b { font-size: .66rem; color:#7b708d; text-transform: uppercase; letter-spacing:.05em; }
.detail-item span { display:block; margin-top: 5px; font-size: .8rem; font-weight:700; }
.badge-grid { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; margin-top: 12px; }
.mini-card { padding: 10px; }
.mini-card.center { text-align:center; }
.divider-head {
  display:flex; justify-content:space-between; gap:10px; align-items:center;
}
.divider-head h3, .divider-head h4 { margin:0; }
.divider-head small { color: var(--muted); }
.seller-module .seller-name { font-size: 1rem; margin-top: 4px; font-weight: 800; }
.trust-badges { margin-top: 10px; display:flex; gap: 8px; flex-wrap:wrap; }
.trust-badge {
  flex:1 1 0;
  padding: 10px; border-radius: 12px; background:#fbf9fd; border:1px solid #f0e7f5; min-width: 80px;
}
.trust-badge b { display:block; font-size: .7rem; }
.trust-badge span { display:block; margin-top: 4px; color:var(--muted); font-size:.65rem; line-height:1.25; }
.review-pill-grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:10px; margin-top:12px; }
.review-pill {
  padding: 10px; border-radius: 12px; background: #fbf9fd; border:1px solid #f1e9f5;
}
.review-pill b { display:block; font-size:.72rem; }
.review-pill span { display:block; margin-top:4px; color:var(--muted); font-size:.68rem; line-height:1.25; }
.ugc-row { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:8px; margin-top:12px; }
.ugc-thumb {
  height: 96px; border-radius: 12px; background: linear-gradient(180deg, #ece5ff, #f9dcea); display:grid; place-items:center; color:#5b4a72; font-size:1.35rem; font-weight:800;
}
.review-quote {
  margin-top: 12px; padding: 12px; border-radius: 14px; background: #fffdf2; border: 1px solid #f2e8a7;
}
.review-quote b { font-size: .8rem; }
.review-quote p { margin: 6px 0 0; font-size: .76rem; color:#5d526e; line-height:1.45; }
.transaction-list { display:grid; gap:10px; margin-top:12px; }
.transaction-item {
  display:flex; align-items:flex-start; gap:10px; padding: 10px 0; border-bottom:1px dashed #eee3f0;
}
.transaction-item:last-child { border-bottom:0; }
.transaction-icon {
  width: 34px; height: 34px; border-radius: 10px; background: #f6f3fb; display:grid; place-items:center; color:#654f82; font-weight:800;
}
.transaction-copy b { display:block; font-size:.79rem; }
.transaction-copy span { display:block; color:var(--muted); font-size:.71rem; margin-top:3px; line-height:1.35; }
.bottom-cta {
  position: absolute; left: 0; right: 0; bottom: 58px; z-index: 4;
  padding: 12px 14px 0;
}
.cta-bar {
  display:grid; grid-template-columns: 1fr 1fr; gap: 10px;
}
.cta-button {
  border-radius: 14px; padding: 14px 16px; border:1px solid var(--brand); background:#fff; color:var(--brand-dark); font-weight:800;
}
.cta-button.primary { background: linear-gradient(135deg, var(--brand-dark), var(--brand)); color:#fff; border-color:transparent; }
.navbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 4;
  padding: 10px 10px 14px;
  background: rgba(255,255,255,.97);
  border-top:1px solid #ede5f1;
}
.navbar-grid { display:grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap:8px; }
.nav-item {
  padding: 8px 6px; border-radius: 12px; background: transparent; border:0; color:#6d617d; text-align:center;
  display:grid; gap: 4px; justify-items:center; font-size:.66rem; font-weight:700;
}
.nav-item.active { color: var(--brand-dark); background: #fff2f9; }
